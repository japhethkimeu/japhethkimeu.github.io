<!-- Used by theme-bio-builtin-1 -->

{% if site.data.bio.memberships %}
<div class="row">
  <div class="two wide column">
    <h3 class="ui left aligned header no-bottom">Memberships</h3>
  </div>
  <div class="fourteen wide column no-bottom">
    {% for entry in site.data.bio.memberships %}
    <p style="margin: 0; padding: 1px 0; line-height: 1.3;"><b>{{ entry.role }}</b> &mdash; {{ entry.organization }}</p>
    {% endfor %}
  </div>
</div>
{% endif %}
