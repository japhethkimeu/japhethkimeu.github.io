<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- SEO Meta Tags -->
  <meta name="description" content="Japheth Kimeu — Geospatial & AI Technical Lead at FAO and GIS & Data Specialist at Connected Conservation Foundation. Earth observation, GeoAI, conservation technology, and nature-climate solutions across Africa.">
  <meta name="author" content="Japheth Kimeu">
  <meta name="keywords" content="geospatial, remote sensing, GIS, earth observation, GeoAI, conservation, FAO, climate-smart agriculture, nature-based solutions, Africa, wildlife corridor, biodiversity">

  <!-- Open Graph / LinkedIn / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://japhethkimeu.github.io">
  <meta property="og:title" content="Japheth Kimeu | Geospatial Technical Lead">
  <meta property="og:description" content="Geospatial & AI Technical Lead at FAO and GIS & Data Specialist at Connected Conservation Foundation. Earth observation, GeoAI, conservation technology, and nature-climate solutions across Africa.">
  <meta property="og:image" content="https://japhethkimeu.github.io/images/kim.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Japheth Kimeu | Geospatial Technical Lead">
  <meta name="twitter:description" content="Geospatial & AI Technical Lead at FAO and GIS & Data Specialist at Connected Conservation Foundation.">
  <meta name="twitter:image" content="https://japhethkimeu.github.io/images/kim.png">

  <title>
    {% if page.title %}
      {{ page.title }} |
    {% endif %}
    {{ site.title }}
  </title>

  <!-- Load Javascript and CSS for Semantic UI -->
  <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
  <script src="{{ site.baseurl }}/css/semantic-ui/semantic.min.js"></script>
  <link rel="stylesheet" href="{{ site.baseurl }}/css/semantic-ui/semantic.min.css">

  <!-- Load Techfolio CSS customizations -->
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl}}/css/stylesheet-default.css">
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl}}/css/stylesheet-customizations.css">

  <link rel="stylesheet" type="text/css" href="{{ site.baseurl}}/css/print-default.css" media="print">
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl}}/css/print-customizations.css" media="print">

  <link rel="stylesheet" type="text/css" href="{{ site.baseurl}}/css/rouge/{{ site.rouge-theme}}.css">

  {% if site.mathjax %}
  <script type="text/javascript"
          src="//cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
  {% endif %}

</head>
